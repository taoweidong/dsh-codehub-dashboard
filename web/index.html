<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CodeHub 看板</title>
<style>
:root{
  /* ===== design tokens ===== */
  /* spacing scale — semantic, one source of truth */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:48px;
  /* radius */
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-full:999px;
  /* type scale */
  --fs-xs:11.5px; --fs-sm:12.5px; --fs-md:13.5px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:26px;
  /* elevation (subtle, two levels only) */
  --shadow-sm:0 1px 2px rgba(27,31,36,.06);
  --shadow-md:0 1px 3px rgba(27,31,36,.08),0 8px 24px rgba(27,31,36,.06);
  /* z-index semantic scale */
  --z-backdrop:40; --z-drawer:50; --z-toast:90;
  /* motion */
  --ease-out:cubic-bezier(.25,1,.5,1); --dur-fast:.14s; --dur-med:.22s;
  --bg:#f6f8fa; --panel:#ffffff; --panel2:#f6f8fa; --text:#1f2328; --muted:#656d76;
  --border:#d0d7de; --border2:#eaeef2; --accent:#4d6bfe; --accent-soft:#4d6bfe1a;
  --green:#1a7f37; --green-bg:#dafbe1; --red:#cf222e; --red-bg:#ffebe9;
  --purple:#8250df; --purple-bg:#fbefff; --yellow:#9a6700; --yellow-bg:#fff8c5;
  --gray:#57606a; --gray-bg:#eaeef2; --blue:#0969da; --blue-bg:#ddf4ff;
}
@media (prefers-color-scheme: dark){
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --text:#e6edf3; --muted:#8b949e;
  --border:#30363d; --border2:#21262d; --accent:#6d8cff; --accent-soft:#6d8cff22;
  --green:#3fb950; --green-bg:#12261e; --red:#f85149; --red-bg:#2d1618;
  --purple:#bc8cff; --purple-bg:#211a2e; --yellow:#d29922; --yellow-bg:#2a2314;
  --gray:#8b949e; --gray-bg:#21262d; --blue:#58a6ff; --blue-bg:#12233b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font:var(--fs-base)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ===== top bar ===== */
.topbar{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-2) clamp(var(--sp-4),2vw,var(--sp-5));background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--sp-2);font-weight:700;font-size:var(--fs-md);white-space:nowrap}
.brand svg{color:var(--accent)}
.nav{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.nav button{border:0;background:transparent;color:var(--muted);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);font-weight:500;transition:background var(--dur-fast),color var(--dur-fast)}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.topbar .spacer{flex:1}
.srcbadge{font-size:var(--fs-sm);color:var(--muted);border:1px solid var(--border);border-radius:var(--r-full);padding:2px var(--sp-3);white-space:nowrap;display:inline-flex;align-items:center;gap:var(--sp-2)}
.srcbadge .dot{width:7px;height:7px;border-radius:var(--r-full);background:var(--muted);flex:none}
.srcbadge.ok .dot{background:var(--green)}
.srcbadge.bad .dot{background:var(--red)}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);font-weight:500;display:inline-flex;align-items:center;gap:var(--sp-2);transition:background var(--dur-fast),border-color var(--dur-fast)}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red-bg);background:transparent}
.btn.sm{padding:3px var(--sp-3);font-size:var(--fs-sm);border-radius:var(--r-sm)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.spin{animation:rot 1s linear infinite;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.updated{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}

/* ===== layout ===== */
.main{flex:1;overflow:auto;padding:clamp(var(--sp-3),2vw,var(--sp-5));min-height:0}
.wrap{max-width:1180px;margin:0 auto}
.banner{display:flex;gap:var(--sp-2);align-items:center;background:var(--yellow-bg);border:1px solid var(--yellow);color:var(--text);border-radius:var(--r-lg);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-5);font-size:var(--fs-sm)}
.banner .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:var(--fs-lg);line-height:1}
.grid{display:grid;gap:var(--sp-4)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));margin-bottom:var(--sp-5)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.kpi{padding:var(--sp-3) var(--sp-4);cursor:pointer;transition:transform var(--dur-med) var(--ease-out),border-color var(--dur-med),box-shadow var(--dur-med);display:block}
.kpi:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:var(--shadow-md)}
.kpi .lab{font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:var(--sp-2)}
.kpi .val{font-size:clamp(var(--fs-xl),2.4vw,var(--fs-2xl));font-weight:700;margin-top:var(--sp-1);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .sub{font-size:var(--fs-xs);color:var(--muted)}
.kpi.hot .val{color:var(--accent)}
.kpi.warn .val{color:var(--red)}
.kpi.ok .val{color:var(--green)}
/* informational metrics recede; action metrics stay solid */
.kpi.soft{background:var(--panel2);border-color:var(--border2);box-shadow:none}
.kpi.soft .val{font-weight:600;color:var(--muted)}
.kpi.soft:hover{border-color:var(--border)}
.charts2{grid-template-columns:3fr 2fr}
.charts2b{grid-template-columns:1fr 1fr}
@media(max-width:900px){.charts2,.charts2b{grid-template-columns:1fr}}
.card .hd{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border2);font-weight:600;font-size:var(--fs-md)}
.card .hd .sub{font-weight:400;color:var(--muted);font-size:var(--fs-sm)}
.card .bd{padding:var(--sp-3) var(--sp-4)}
.legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-2)}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:var(--r-sm);margin-right:var(--sp-1);vertical-align:-1px}

/* ===== chips ===== */
.chip{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-xs);font-weight:600;border-radius:var(--r-full);padding:1px var(--sp-2);white-space:nowrap;border:1px solid transparent}
.chip.open{background:var(--green-bg);color:var(--green)}
.chip.merged{background:var(--purple-bg);color:var(--purple)}
.chip.closed{background:var(--red-bg);color:var(--red)}
.chip.draft{background:var(--gray-bg);color:var(--gray)}
.chip.approved{background:var(--green-bg);color:var(--green)}
.chip.changes_requested{background:var(--red-bg);color:var(--red)}
.chip.pending{background:var(--yellow-bg);color:var(--yellow)}
.chip.none{background:var(--gray-bg);color:var(--gray)}
.chip.ci-success{background:var(--green-bg);color:var(--green)}
.chip.ci-failure{background:var(--red-bg);color:var(--red)}
.chip.ci-pending{background:var(--yellow-bg);color:var(--yellow)}
.chip.ci-none{background:var(--gray-bg);color:var(--gray)}
.chip.ci-unknown{background:transparent;color:var(--muted);border:1px dashed var(--border2)}
.chip.src{background:var(--blue-bg);color:var(--blue);font-weight:500}
.chip.needs{background:var(--accent-soft);color:var(--accent)}
.chip.reply{background:var(--yellow-bg);color:var(--yellow)}
.chip.resolved{background:var(--gray-bg);color:var(--gray);font-weight:500}
.chip.label{background:var(--panel2);color:var(--muted);border-color:var(--border);font-weight:500}

/* ===== avatar ===== */
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--r-full);color:#fff;font-size:var(--fs-xs);font-weight:700;flex:none}
.av.lg{width:30px;height:30px;font-size:var(--fs-sm)}
.who{display:inline-flex;align-items:center;gap:var(--sp-2);min-width:0}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== MR table ===== */
.toolbar{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;margin-bottom:var(--sp-4)}
.toolbar select,.toolbar input[type=text],.toolbar input[type=search]{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);font:inherit;max-width:220px}
.toolbar input[type=search]{min-width:180px}
.tgl{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-sm);color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-full);padding:var(--sp-1) var(--sp-3);cursor:pointer;user-select:none;transition:color var(--dur-fast),border-color var(--dur-fast),background var(--dur-fast)}
.tgl input{accent-color:var(--accent);margin:0}
.tgl.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tgl:disabled{opacity:.55;cursor:not-allowed}
.mrlist{display:flex;flex-direction:column}
.mrrow{display:flex;gap:var(--sp-2);align-items:flex-start;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border2);cursor:pointer;transition:background var(--dur-fast)}
.mrrow:last-child{border-bottom:0}
.mrrow:hover{background:var(--panel2)}
.mrrow .no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:var(--fs-sm);flex:none;width:52px;padding-top:2px}
.mrrow .body{flex:1;min-width:0}
.mrrow .t1{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.mrrow .title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.mrrow .t2{display:flex;gap:var(--sp-2);align-items:center;color:var(--muted);font-size:var(--fs-sm);margin-top:var(--sp-1);flex-wrap:wrap}
.mrrow .metrics{display:flex;gap:var(--sp-3);align-items:center;flex:none;padding-top:2px;font-size:var(--fs-sm);color:var(--muted)}
.branch{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:var(--fs-xs);background:var(--panel2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:0 var(--sp-2);color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-tag{font-size:var(--fs-xs);color:var(--blue);background:var(--blue-bg);border-radius:var(--r-sm);padding:0 var(--sp-2);white-space:nowrap}
.adds{color:var(--green)} .dels{color:var(--red)}

/* ===== reviews inbox ===== */
.group{margin-bottom:var(--sp-4)}
.group .ghd{display:flex;gap:var(--sp-2);align-items:center;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border2);cursor:pointer;flex-wrap:wrap}
.group .ghd:hover{background:var(--panel2)}
.group .ghd .title{font-weight:600}
.cmt{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border2)}
.cmt:last-child{border-bottom:0}
.cmt .body{flex:1;min-width:0}
.cmt .meta{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-1)}
.cmt .txt{white-space:pre-wrap;word-break:break-word}
.filechip{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:var(--fs-xs);background:var(--blue-bg);color:var(--blue);border-radius:var(--r-sm);padding:1px var(--sp-2)}

/* ===== repos ===== */
.repogrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.repo .hd{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.repo .hd .nm{font-weight:700;font-size:var(--fs-base)}
.repo .hd .owner{color:var(--muted);font-size:var(--fs-sm)}
.repo .desc{color:var(--muted);font-size:var(--fs-sm);margin:var(--sp-2) 0 var(--sp-3);min-height:19px}
.repo .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:var(--sp-2);text-align:center;margin-bottom:var(--sp-3)}
.repo .nums .n{font-size:var(--fs-lg);font-weight:700;font-variant-numeric:tabular-nums}
.repo .nums .l{font-size:var(--fs-xs);color:var(--muted)}
.stackbar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--gray-bg)}
.stackbar i{display:block;height:100%}
.repo .ft{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3);font-size:var(--fs-sm);color:var(--muted);flex-wrap:wrap}
.errbox{background:var(--red-bg);color:var(--red);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm);margin-top:var(--sp-2);word-break:break-all}

/* ===== feed ===== */
.feed{max-height:430px;overflow:auto}
.feed .ev{display:flex;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);border-bottom:1px solid var(--border2);font-size:var(--fs-sm);align-items:baseline;transition:background var(--dur-fast)}
.feed .ev:last-child{border-bottom:0}
.feed .ev:hover{background:var(--panel2)}
.feed .ic{flex:none;width:20px;text-align:center}
.feed .tx{flex:1;min-width:0}
.feed .tx .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .when{color:var(--muted);font-size:var(--fs-xs);flex:none}

/* ===== charts ===== */
.hbar-row{display:grid;grid-template-columns:170px 1fr 44px;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-2);font-size:var(--fs-sm)}
.hbar-row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hbar-track{background:var(--panel2);border-radius:5px;height:16px;overflow:hidden;display:flex}
.hbar-track i{display:block;height:100%}
.hbar-row .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
svg text{font-family:inherit}

/* ===== drawer ===== */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity var(--dur-med);z-index:var(--z-backdrop)}
.backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,94vw);background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(102%);transition:transform var(--dur-med) var(--ease-out);display:flex;flex-direction:column;z-index:var(--z-drawer)}
.drawer.open{transform:none}
.drawer .dhd{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border)}
.drawer .dhd .t{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .dbd{flex:1;overflow:auto;padding:var(--sp-4);min-height:0}
.drawer .dclose{border:0;background:transparent;color:var(--muted);font-size:var(--fs-xl);line-height:1;padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm)}
.drawer .dclose:hover{background:var(--panel2);color:var(--text)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:var(--sp-2) var(--sp-3);font-size:var(--fs-sm);margin-bottom:var(--sp-4)}
.kv .k{color:var(--muted)}
.sect{font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:var(--sp-5) 0 var(--sp-2);display:flex;align-items:center;gap:var(--sp-2)}
.sect::after{content:"";flex:1;height:1px;background:var(--border2)}
.rv,.cm2{border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-2);background:var(--panel2)}
.rv .meta,.cm2 .meta{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-1)}
.rv .txt,.cm2 .txt{font-size:var(--fs-sm);white-space:pre-wrap;word-break:break-word}

/* ===== settings ===== */
.setform{max-width:860px}
.fld{margin-bottom:var(--sp-3)}
.fld label{display:block;font-size:var(--fs-sm);font-weight:600;color:var(--muted);margin-bottom:var(--sp-1)}
.fld input[type=text],.fld input[type=password],.fld input[type=number],.fld select{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);font:inherit}
.fld input:focus,.fld select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.fld .hint{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--sp-1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-3)}
@media(max-width:700px){.row2,.row3{grid-template-columns:1fr}}
.listrow{display:grid;gap:var(--sp-2);align-items:center;border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--sp-3);margin-bottom:var(--sp-2);background:var(--panel2)}
.listrow.inst{grid-template-columns:1fr 2fr 90px 1.4fr auto}
.listrow.repo{grid-template-columns:110px 2fr 2fr 90px auto}
@media(max-width:900px){.listrow.inst,.listrow.repo{grid-template-columns:1fr 1fr}.listrow .full{grid-column:1/-1}}
.listrow input,.listrow select{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-2);font:inherit;width:100%}
.sectcard{margin-bottom:var(--sp-5)}
.sectcard .hd{justify-content:space-between}
.testres{width:100%;border-collapse:collapse;font-size:var(--fs-sm);margin-top:var(--sp-2)}
.testres td,.testres th{border-bottom:1px solid var(--border2);padding:var(--sp-1) var(--sp-2);text-align:left}
.testres .ok{color:var(--green);font-weight:700}
.testres .bad{color:var(--red);font-weight:700}
.discover .item{display:flex;gap:var(--sp-2);align-items:center;padding:var(--sp-2) 0;border-bottom:1px dashed var(--border2);font-size:var(--fs-sm)}
.discover .item .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.setbar{display:flex;gap:var(--sp-3);align-items:center;margin-top:var(--sp-2);position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:var(--sp-3) 0}

/* ===== misc ===== */
.empty{padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:var(--sp-2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);border-radius:var(--r-lg);padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);opacity:0;transition:transform var(--dur-med) var(--ease-out),opacity var(--dur-med);z-index:var(--z-toast);box-shadow:var(--shadow-md);max-width:80vw}
.toast.show{transform:translateX(-50%);opacity:1}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count-pill{background:var(--panel2);border:1px solid var(--border2);border-radius:var(--r-full);font-size:var(--fs-xs);color:var(--muted);padding:0 var(--sp-2)}
/* The work surface stays quiet; source diff and editable review are distinct. */
.drawer{width:min(1060px,96vw)}
.backdrop{z-index:var(--z-backdrop)}
.review-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--sp-4);align-items:start}
.editor{display:block;width:100%;min-height:300px;resize:vertical;border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3);background:var(--panel2);color:var(--text);font:var(--fs-sm)/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}
.editor.diff{white-space:pre;overflow:auto;min-height:420px}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;max-width:80ch;font-size:var(--fs-sm)}
.notice{padding:var(--sp-2) var(--sp-3);border-left:3px solid var(--accent);background:var(--panel2);font-size:var(--fs-sm);margin-bottom:var(--sp-3);overflow-wrap:anywhere;border-radius:0 var(--r-sm) var(--r-sm) 0}
.notice.warn{border-color:var(--yellow)}
.inline-actions{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-3) 0}
.listrow.org{grid-template-columns:1fr 2fr auto auto}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.listrow>*{min-width:0}.setbar{flex-wrap:wrap}.kv>*{min-width:0;overflow-wrap:anywhere}
#hostStatus{margin:0;border-radius:0;padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);background:var(--panel2);color:var(--muted)}
@media(max-width:700px){.review-grid{grid-template-columns:1fr}.editor.diff{min-height:230px}.mrrow{flex-wrap:wrap}.mrrow .metrics{width:100%;padding-left:62px;flex-wrap:wrap}.main{padding:var(--sp-3)}.topbar{padding:var(--sp-2) var(--sp-3);gap:var(--sp-2)}.nav button{padding:var(--sp-2) var(--sp-2)}.hbar-row{grid-template-columns:110px 1fr 36px}.listrow.org{grid-template-columns:1fr 1fr}.toolbar>*{max-width:100%}.drawer .dbd{padding:var(--sp-3)}.brand{font-size:var(--fs-base)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.kpi:hover{transform:none}}
.flist{display:flex;flex-direction:column;gap:var(--sp-2);margin:var(--sp-2) 0}
.frow{border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);background:var(--surface2)}
.fhl{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;cursor:pointer}
.fhl .ftitle{font-weight:600;overflow-wrap:anywhere}
.fhl .floc{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text2)}
.fmeta{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;margin:var(--sp-1) 0 0 var(--sp-5)}
.fdet{margin-top:var(--sp-2);display:flex;flex-direction:column;gap:var(--sp-2)}
.fdet p{margin:0}
.chip.blocker{background:rgba(239,68,68,.14);color:#dc2626}
.chip.major{background:rgba(245,158,11,.16);color:#b45309}
.chip.minor{background:rgba(59,130,246,.14);color:#2563eb}
.chip.nit{background:rgba(107,114,128,.14);color:#4b5563}
.mrrow{position:relative}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="4.5" cy="3.5" r="2" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="4.5" cy="12.5" r="2" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="12" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>
        <path d="M4.5 5.5v5M4.5 9.2c0-2.2 1.3-3 5.6-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <path d="M9.4 3.9l1.3 1.9 2-.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      CodeHub 看板
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <span class="srcbadge" id="srcbadge"></span>
    <span class="updated" id="updated"></span>
    <button class="btn" id="refreshBtn" title="立即刷新数据" aria-label="立即刷新数据">
      <svg id="refreshIco" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 1 1 .908-.418A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
      刷新
    </button>
  </div>
  <div id="hostStatus" role="status">DSH 原生宿主不可用（独立开发页面）；会话打开与目录选择仅在 DSH 内可用。</div>
  <div class="main" id="main"></div>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" inert><div class="dhd"><span class="t" id="drawerTitle"></span><button class="dclose" id="drawerClose" title="关闭" aria-label="关闭详情">✕</button></div><div class="dbd" id="drawerBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ================= helpers ================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// esc() neutralises quoting but not the scheme: a remote-provided URL must never
// become a javascript:/data: handler. Only absolute http(s) is linkable.
const safeUrl = (u) => { const s = String(u ?? ""); return /^https?:\/\/\S+$/i.test(s) ? s : ""; };
const AV_COLORS = ["#e17055","#0984e3","#6c5ce7","#00b894","#d63031","#e84393","#f39c12","#16a085","#8e44ad","#2d3436","#c0392b","#27ae60"];
const avColor = (login) => AV_COLORS[Math.abs(hashStr(String(login || "?"))) % AV_COLORS.length];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return h}
const initials = (p) => { const n = String(p?.name || p?.login || "?").trim(); return /[\u4e00-\u9fa5]/.test(n) ? n.slice(-2) : n.slice(0, 2).toUpperCase(); };
function avatar(p, lg){ return `<span class="av${lg?" lg":""}" style="background:${avColor(p?.login)}" title="${esc(p?.name||"")} (${esc(p?.login||"")})">${esc(initials(p))}</span>`; }
function relTime(iso){ if(!iso) return "—"; const t=new Date(iso).getTime(); if(!Number.isFinite(t)) return "—";
  const d=Date.now()-t; if(d<60e3) return "刚刚"; if(d<3600e3) return Math.floor(d/60e3)+" 分钟前"; if(d<86400e3) return Math.floor(d/3600e3)+" 小时前";
  if(d<30*86400e3) return Math.floor(d/86400e3)+" 天前"; const dt=new Date(t); return `${dt.getMonth()+1}月${dt.getDate()}日`; }
const absTime = (iso) => iso ? new Date(iso).toLocaleString("zh-CN",{hour12:false}) : "";
const fmtNum = (n) => Number(n||0).toLocaleString("zh-CN");

function timeoutSignal(ms){ try{ return typeof AbortSignal!=="undefined"&&AbortSignal.timeout?AbortSignal.timeout(ms||20000):undefined; }catch{ return undefined; } }
function timeoutError(e){ return e&&(e.name==="TimeoutError"||e.name==="AbortError")?new Error("请求超时（20 秒），请检查网络后重试"):e; }
async function api(op, params){ const u=new URL("/codehub/api", location.origin); u.searchParams.set("op",op);
  for(const [k,v] of Object.entries(params||{})) if(v!==undefined&&v!==null&&v!=="") u.searchParams.set(k,String(v));
  let r; try{ r=await fetch(u,{headers:{accept:"application/json"},signal:timeoutSignal()}); }catch(e){ throw timeoutError(e); }
  const j=await r.json().catch(()=>({ok:false,error:"bad response"}));
  if(!r.ok||!j.ok) throw new Error(j.error||("HTTP "+r.status)); return j; }
async function apiPost(op, body, opts){ let r; try{ r=await fetch("/codehub/api?op="+encodeURIComponent(op),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body||{}),signal:timeoutSignal(opts&&opts.timeoutMs)}); }catch(e){ throw timeoutError(e); }
  const j=await r.json().catch(()=>({ok:false,error:"bad response"})); if(!r.ok||!j.ok) throw new Error(j.error||("HTTP "+r.status)); return j; }

function toast(msg, ms){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms||2600); }

/* Only the owning same-origin DSH frame can announce or answer native actions. */
const host={available:false,openSession:false,pickDirectory:false};
const hostPending=new Map();
function receiveHost(event){
  if(window.parent===window||event.origin!==location.origin||event.source!==window.parent) return;
  const m=event.data;
  if(!m||typeof m!=="object"||Array.isArray(m)) return;
  if(m.type==="codehub:host-ready"&&m.version===1&&typeof m.openSession==="boolean"&&typeof m.pickDirectory==="boolean"){
    Object.assign(host,{available:true,openSession:m.openSession,pickDirectory:m.pickDirectory});
    $("#hostStatus").textContent="DSH 原生宿主已连接 · 使用现有会话、目录选择与模型配置";
    if(state.view==="settings") render();
    return;
  }
  if(m.type!=="codehub:response"||typeof m.id!=="string"||typeof m.ok!=="boolean") return;
  const pending=hostPending.get(m.id);
  if(!pending||pending.action!==m.action||(!m.ok&&typeof m.error!=="string")||(m.ok&&m.action==="pick-directory"&&typeof m.path!=="string")) return;
  clearTimeout(pending.timer); hostPending.delete(m.id);
  m.ok?pending.resolve(m):pending.reject(new Error(m.error));
}
window.addEventListener("message",receiveHost);
function hostRequest(action,sessionId){
  if(!host.available||window.parent===window) return Promise.reject(new Error("DSH 原生宿主不可用，请在 DSH 内打开 CodeHub"));
  if(!["open-session","pick-directory"].includes(action)) return Promise.reject(new Error("不支持的原生操作"));
  if(!(action==="open-session"?host.openSession:host.pickDirectory)) return Promise.reject(new Error("DSH 原生服务不可用"));
  const id=crypto.randomUUID();
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{hostPending.delete(id);reject(new Error("DSH 操作等待超时，请确认原生窗口状态"));},120000);
    hostPending.set(id,{action,resolve,reject,timer});
    const message={type:"codehub:request",id,action};
    if(action==="open-session") message.sessionId=sessionId;
    window.parent.postMessage(message,location.origin);
  });
}
window.addEventListener("pagehide",()=>{
  window.removeEventListener("message",receiveHost);
  for(const p of hostPending.values()){clearTimeout(p.timer);p.reject(new Error("页面已关闭"));}
  hostPending.clear();
});

const STATE_CH = { open:"开放", merged:"已合并", closed:"已关闭" };
const RD_CH = { approved:"已通过", changes_requested:"需修改", pending:"评审中", none:"未评审" };
const CI_TXT = { success:"CI ✓", failure:"CI ✗", pending:"CI ●", none:"CI —", unknown:"CI 未查询" };
const CI_TITLE = { unknown:"本次未查询历史 PR 的 CI 状态（仅查询未合并的 PR）" };
const SRC_CH = { gh:"gh CLI", http:"REST API", "git-meta":"Git 元信息", error:"出错" };
const chip = (cls, txt, title) => `<span class="chip ${esc(cls)}"${title?` title="${esc(title)}"`:""}>${esc(txt)}</span>`;
const stateChip = (mr) => mr.draft && mr.state==="open" ? chip("draft","草稿") : chip(mr.state, STATE_CH[mr.state]||mr.state);
const rdChip = (mr) => chip(mr.reviewDecision||"none", RD_CH[mr.reviewDecision||"none"]||"—");
const ciChip = (mr) => { const s = mr.ciState || "none"; return chip("ci-"+s, CI_TXT[s]||"—", CI_TITLE[s]); };
const resolutionChip = (c) => c.resolved===true?chip("resolved","已解决"):c.resolved===false?chip("pending","未解决"):chip("none","线程状态未知");

/* ================= state & router ================= */
const params = new URLSearchParams(location.search);
const CWD = params.get("cwd") || "";
const state = {
  boot: null, overview: null, view: "overview", busy: false,
  overviewError: "", overviewLoaded: false,
  mrFilters: { repoKey:"", state:"all", q:"", needsReview:false, unresolved:false, ci:"", sort:"updated" },
  mrData: null,
  rvFilters: { repoKey:"", unresolved:false, needsReply:false, q:"" },
  rvData: null,
  issueFilters: {repoKey:"",state:"open",q:"",assignee:""}, issueData:null,
  mrError:"", rvError:"", issueError:"",
  configDraft: null, discover: null, testResults: null, saving: false,
  models:null, modelsError:"", modelsLoading:false,
  bannerClosed: false,
};
function currentHash(){ const h=(location.hash||"#/overview").slice(2); const [v,...rest]=h.split("&");
  const p={}; for(const kv of rest){ const [k,val]=kv.split("="); if(k) p[k]=decodeURIComponent(val||""); } return {view:v||"overview",p}; }
function nav(view, p){ const qs=p&&Object.keys(p).length?"&"+Object.entries(p).filter(([,v])=>v!==""&&v!==false&&v!=null).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&"):"";
  location.hash="#/"+view+qs; }
window.addEventListener("hashchange", ()=>route());

let routeSeq=0;
function route(){ const nav=++routeSeq; const {view,p}=currentHash(); state.view=["overview","mrs","issues","reviews","repos","stats","settings"].includes(view)?view:"overview";
  invalidateLists();
  if(state.view==="mrs") Object.assign(state.mrFilters,{repoKey:p.repoKey||"",state:p.state||"all",needsReview:p.needsReview==="1",unresolved:p.unresolved==="1",q:p.q||"",ci:p.ci||"",sort:p.sort||state.mrFilters.sort});
  if(state.view==="reviews") Object.assign(state.rvFilters,{repoKey:p.repoKey||"",unresolved:p.unresolved==="1",needsReply:p.needsReply==="1",q:p.q||""});
  if(state.view==="issues") Object.assign(state.issueFilters,{repoKey:p.repoKey||"",state:p.state||"open",q:p.q||"",assignee:p.assignee||""});
  render();
  if(state.view==="settings") loadModels();
  // Every overview-backed view needs the repo list before its own request, and a
  // superseded route must not fire a list for the page the user already left.
  else withBusy(async()=>{
    if(!state.overview){ const ok=await loadOverview(false); if(nav!==routeSeq)return; if(!ok&&!state.overview){render();return;} }
    if(nav!==routeSeq) return;
    await loadActiveList();
    if(nav===routeSeq) render();
  });
}

/* ================= data loading ================= */
async function boot(){ try{ state.boot=await api("boot"); await loadOverview(false); }
  catch(e){ toast("加载失败: "+e.message,4000); } route(); startAutoRefresh(); }
let overviewSeq=0, mrSeq=0, rvSeq=0, issueSeq=0;
async function loadOverview(force){ const seq=++overviewSeq;
  try{ const j=force?await api("refresh"):await api("overview"); if(seq!==overviewSeq)return false;
    state.overview=j.overview; state.overviewLoaded=true; state.overviewError="";
    if(state.boot)state.boot.hasData=!!j.overview; return true;
  }catch(e){ if(seq===overviewSeq){ state.overviewError=e.message; state.overviewLoaded=true; } return false; } }
function invalidateLists(){ ++mrSeq;++rvSeq;++issueSeq;state.mrData=null;state.rvData=null;state.issueData=null;state.mrError="";state.rvError="";state.issueError=""; }
async function loadMrs(){ const f={...state.mrFilters},seq=++mrSeq;state.mrError="";
  try{ const j=await api("mrs",{...f,needsReview:f.needsReview?"1":"",unresolved:f.unresolved?"1":"",limit:200});if(seq===mrSeq)state.mrData=j; }
  catch(e){if(seq===mrSeq)state.mrError=e.message;} }
async function loadReviews(){ const f={...state.rvFilters},seq=++rvSeq;state.rvError="";
  try{const j=await api("reviews",{...f,unresolved:f.unresolved?"1":"",needsReply:f.needsReply?"1":"",limit:300});if(seq===rvSeq)state.rvData=j;}
  catch(e){if(seq===rvSeq)state.rvError=e.message;} }
async function loadIssues(){const f={...state.issueFilters},seq=++issueSeq;state.issueError="";
  try{const j=await api("issues",f);if(seq===issueSeq)state.issueData=j;}
  catch(e){if(seq===issueSeq)state.issueError=e.message;} }
async function loadActiveList(){if(state.view==="mrs")await loadMrs();else if(state.view==="reviews")await loadReviews();else if(state.view==="issues")await loadIssues();}
async function refreshData(force){render();const ok=await loadOverview(force);if(ok||state.overview)await loadActiveList();render();return ok;}
let autoTimer;
function startAutoRefresh(){clearInterval(autoTimer);autoTimer=setInterval(async()=>{
  if(document.visibilityState!=="visible"||state.busy||state.view==="settings")return;
  await withBusy(()=>refreshData(false));
},60000);}
async function loadModels(){if(state.models||state.modelsLoading)return;state.modelsLoading=true;
  try{state.models=(await api("models")).providers||[];state.modelsError="";}
  catch(e){state.modelsError=e.message;}finally{state.modelsLoading=false;if(state.view==="settings")render();} }

/* ================= charts ================= */
function donut(dist){ const total=Math.max(1,dist.open+dist.merged+dist.closed);
  const segs=[["var(--green)",dist.open],["var(--purple)",dist.merged],["var(--red)",dist.closed]];
  let acc=0; const R=52,C=2*Math.PI*R; let paths="";
  for(const [color,v] of segs){ if(!v) continue; const frac=v/total;
    paths+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${color}" stroke-width="17" stroke-dasharray="${(frac*C-2).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-acc*C+C/4).toFixed(1)}" stroke-linecap="butt"><title>${frac*100}%</title></circle>`; acc+=frac; }
  return `<div style="display:flex;align-items:center;gap:var(--sp-4)">
    <svg width="140" height="140" viewBox="0 0 140 140">${paths||`<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--gray-bg)" stroke-width="17"/>`}
      <text x="70" y="66" text-anchor="middle" style="font-size:var(--fs-xl)" font-weight="700" fill="var(--text)">${total}</text>
      <text x="70" y="84" text-anchor="middle" style="font-size:var(--fs-xs)" fill="var(--muted)">MR 总数</text></svg>
    <div style="flex:1">
      ${[["开放",dist.open,"var(--green)"],["已合并",dist.merged,"var(--purple)"],["已关闭",dist.closed,"var(--red)"]].map(([l,v,c])=>
        `<div style="display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-1) 0;font-size:var(--fs-sm)"><span style="width:10px;height:10px;border-radius:var(--r-sm);background:${c}"></span><span class="muted" style="width:52px">${l}</span><b style="font-variant-numeric:tabular-nums">${v}</b><span class="muted" style="font-size:var(--fs-xs)">${total?Math.round(v/total*100):0}%</span></div>`).join("")}
    </div></div>`; }

function lineChart(rows){ if(!rows||!rows.length) return `<div class="empty">暂无数据</div>`;
  const W=640,H=210,PL=34,PR=10,PT=12,PB=24; const iw=W-PL-PR, ih=H-PT-PB;
  const maxV=Math.max(4,...rows.map(r=>Math.max(r.opened,r.merged,r.comments)));
  const yMax=Math.ceil(maxV/4)*4;
  const x=(i)=>PL+(rows.length===1?iw/2:i*iw/(rows.length-1));
  const y=(v)=>PT+ih-(v/yMax)*ih;
  const series=[["opened","新建 MR","var(--accent)"],["merged","合并","var(--purple)"],["comments","检视意见","var(--yellow)"]];
  let grid=""; for(let g=0;g<=4;g++){ const yy=PT+ih*g/4; grid+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--border2)" stroke-width="1"/><text x="${PL-6}" y="${yy+3.5}" text-anchor="end" style="font-size:var(--fs-xs)" fill="var(--muted)">${Math.round(yMax*(1-g/4))}</text>`; }
  let xlabels=""; const step=Math.max(1,Math.floor(rows.length/6));
  rows.forEach((r,i)=>{ if(i%step===0||i===rows.length-1) xlabels+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" style="font-size:var(--fs-xs)" fill="var(--muted)">${r.date.slice(5)}</text>`; });
  let lines="";
  for(const [key,,color] of series){ const pts=rows.map((r,i)=>`${x(i).toFixed(1)},${y(r[key]||0).toFixed(1)}`).join(" ");
    lines+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    lines+=rows.map((r,i)=>(r[key]||0)>0?`<circle cx="${x(i).toFixed(1)}" cy="${y(r[key]).toFixed(1)}" r="2.4" fill="${color}"><title>${r.date} · ${key==="opened"?"新建":key==="merged"?"合并":"意见"} ${r[key]}</title></circle>`:"").join(""); }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${xlabels}${lines}</svg>
    <div class="legend">${series.map(([,l,c])=>`<span><span class="dot" style="background:${c}"></span>${l}</span>`).join("")}</div>`; }

function hbarStacked(repos){ if(!repos.length) return `<div class="empty">暂无仓库</div>`;
  const max=Math.max(1,...repos.map(r=>r.counts.open));
  return repos.map(r=>{ const open=r.counts.open, need=r.counts.needsReview;
    const wO=Math.max(0,(open-need)/max*100), wN=need/max*100;
    return `<div class="hbar-row" title="${esc(r.path)}：开放 ${open}，其中待我评审 ${need}">
      <span class="lb"><a href="#/mrs&repoKey=${encodeURIComponent(r.key)}">${esc(r.name)}</a></span>
      <span class="hbar-track"><i style="width:${wO}%;background:var(--green)"></i><i style="width:${wN}%;background:var(--accent)"></i></span>
      <span class="vv">${open}</span></div>`; }).join("")
    + `<div class="legend"><span><span class="dot" style="background:var(--green)"></span>其他开放 MR</span><span><span class="dot" style="background:var(--accent)"></span>待我评审</span></div>`; }

function hbarReviewers(rows){ if(!rows.length) return `<div class="empty">暂无评审活动</div>`;
  const max=Math.max(1,...rows.map(r=>r.comments+r.reviews));
  return rows.map(r=>{ const c=r.comments/max*100, v=r.reviews/max*100;
    return `<div class="hbar-row" title="${esc(r.name)}：评审 ${r.reviews} 次（通过 ${r.approvals} / 打回 ${r.changesRequested}），意见 ${r.comments} 条（未解决 ${r.unresolved}）">
      <span class="lb">${avatar(r)} ${esc(r.name)}</span>
      <span class="hbar-track"><i style="width:${v}%;background:var(--purple)"></i><i style="width:${c}%;background:var(--yellow)"></i></span>
      <span class="vv">${r.comments+r.reviews}</span></div>`; }).join("")
    + `<div class="legend"><span><span class="dot" style="background:var(--purple)"></span>评审次数</span><span><span class="dot" style="background:var(--yellow)"></span>检视意见</span></div>`; }

/* ================= views ================= */
function kpi(cls,lab,val,sub,hashP){ return `<a class="card kpi ${esc(cls)}" style="color:inherit" href="${esc(hashP)}"><div class="lab">${esc(lab)}</div><div class="val">${typeof val==="number"?fmtNum(val):esc(val)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</a>`; }

function coverageNote(c=state.overview?.coverage){return `<div class="notice${c?.limited?" warn":""}">${esc(c?.note||"统计仅反映当前已拉取的数据，不代表完整历史。")}</div>`;}
function partialErrors(errors,guidance="请刷新重试，并在 GitHub 核对完整数据。"){
  if(!errors?.length)return "";
  const messages=errors.map(e=>typeof e==="string"?e:[e?.repoKey||e?.owner,e?.error||e?.message||"未知错误"].filter(Boolean).join("："));
  return `<div class="notice warn" role="alert">部分数据加载失败，当前结果不完整。${esc(guidance)}<ul>${[...new Set(messages)].map(message=>`<li>${esc(message)}</li>`).join("")}</ul></div>`;
}
function listFailure(error){return `<div class="empty" role="alert">加载失败：${esc(error)}；请刷新重试。</div>`;}
function retryOverviewButton(){return `<button class="btn sm primary" id="retryOverview">重试</button>`;}
function overviewErrorState(){return `<div class="wrap"><div class="card"><div class="empty" role="alert"><div class="big">⚠️</div><b>仓库数据加载失败</b><p class="muted" style="max-width:460px;margin:var(--sp-2) auto">${esc(state.overviewError||"未知错误")}</p>${retryOverviewButton()}</div></div></div>`;}
function overviewFailureNote(){return state.overviewError?`<div class="notice warn" role="alert">刷新失败：${esc(state.overviewError)}；当前显示上次成功数据。${retryOverviewButton()}</div>`:"";}
function overviewPlaceholder(){return state.overviewError?overviewErrorState():state.overviewLoaded?emptyState():`<div class="wrap"><div class="card"><div class="empty">正在加载仓库数据…</div></div></div>`;}
function staleNotice(error){return `<div class="notice warn" role="alert">刷新失败：${esc(error)}；已保留上次成功数据，可点「刷新」重试。</div>`;}
function countLabel(rows,total){const n=Array.isArray(rows)?rows.length:0;const t=Number(total);return Number.isFinite(t)&&t>n?`显示前 ${fmtNum(n)} / 共 ${fmtNum(t)} 条`:`${fmtNum(Number.isFinite(t)?t:n)} 条`;}
const DETAIL_RETRY_NOTE="部分信息未返回，当前详情不完整。请重新打开此详情重试，并在 GitHub 核对完整数据。";
function detailErrors(...sources){ const merged=[...new Set(sources.flat().filter(Boolean))]; return merged.length?partialErrors(merged,DETAIL_RETRY_NOTE):""; }
function viewOverview(){const ov=state.overview;if(!ov)return overviewPlaceholder();const s=ov.summary;

  </div>${coverageNote()}<div class="card"><div class="hd">最近工作动态</div><div class="feed">${ov.recent.map(feedRow).join("")||'<div class="empty">暂无动态；可在设置添加仓库或组织。</div>'}</div></div></div>`;}
function viewStats(){ const ov=state.overview; if(!ov) return overviewPlaceholder();

</div>`; }

const EV_IC = { opened:["🟢","新建了 MR"], merged:["🟣","合并了 MR"], comment:["💬","发表了检视意见"], review:["👀","提交了评审"] };
function feedRow(e){ const [ic,txt]=EV_IC[e.type]||["•",""];
  return `<div class="ev"><span class="ic">${ic}</span><span class="tx">
    <b>${esc(e.actor||"")}</b> ${txt} <a href="javascript:void(0)" data-mr="${esc(e.repoKey)}|${e.mrNumber}" class="ti" style="display:inline">${esc(e.title||("#"+e.mrNumber))}</a>
    <span class="muted">· ${esc(e.repoName||"")}</span></span><span class="when" title="${esc(absTime(e.at))}">${relTime(e.at)}</span></div>`; }

function emptyState(){ return `<div class="wrap"><div class="card"><div class="empty"><div class="big">📦</div>

  <button class="btn primary" onclick="location.hash='#/settings'">去设置</button></div></div></div>`; }

function banner(){ const ov=state.overview; if(!ov||state.bannerClosed) return "";

  const body=!data?(state.mrError?listFailure(state.mrError):`<div class="empty">加载中…</div>`):rows.length?rows.map(mrRow).join(""):`<div class="empty">当前已返回数据中没有符合条件的 MR</div>`;

    <select id="fSort" aria-label="MR 排序">${[["updated","按更新排序"],["created","按创建排序"],["comments","按意见数排序"]].map(([v,l])=>`<option value="${v}"${f.sort===v?" selected":""}>${l}</option>`).join("")}</select>

  <div class="card"><div class="mrlist" id="mrlist">${body}</div></div></div>`; }

function mrRow(m){ return `<div class="mrrow" role="button" tabindex="0" data-mr="${esc(m.repoKey)}|${m.number}">

</div>`; }

function viewReviews(){ const ov=state.overview; if(!ov) return overviewPlaceholder();
  const f=state.rvFilters; const data=state.rvData;
  const resKnown=ov.summary?.resolutionAvailable===true;
  const unresOn=resKnown&&f.unresolved;
  const repoOpts=ov.repos.map(r=>`<option value="${esc(r.key)}"${f.repoKey===r.key?" selected":""}>${esc(r.path)}</option>`).join("");
  let groups="";
  if(!data) groups=state.rvError?`<div class="card">${listFailure(state.rvError)}</div>`:`<div class="card"><div class="empty">加载中…</div></div>`;
  else if(data.comments.length){
    const byMr=new Map();
    for(const c of data.comments){ const k=c.repoKey+"|"+c.mrNumber; if(!byMr.has(k)) byMr.set(k,{first:c,list:[]}); byMr.get(k).list.push(c); }
    for(const {first,list} of byMr.values()){
      groups+=`<div class="card group"><div class="ghd" role="button" tabindex="0" data-mr="${esc(first.repoKey)}|${first.mrNumber}">
        ${chip(first.mrState||"none",STATE_CH[first.mrState]||first.mrState||"—")}<span class="repo-tag">${esc(first.repoPath||first.repoName||first.repoKey)}</span>
        <span class="title">#${first.mrNumber} ${esc(first.mrTitle)}</span>
        <span class="count-pill">${list.length} 条意见</span>${list.some(x=>x.needsReply)?chip("reply","需我回复"):""}</div>

  } else groups=`<div class="card"><div class="empty">${f.unresolved||f.needsReply?"🎉 没有符合条件的检视意见":"暂无检视意见"}</div></div>`;

  ${overviewFailureNote()}
  <div class="toolbar">
    <select id="rRepo" aria-label="检视意见仓库"><option value="">全部仓库</option>${repoOpts}</select>
    <label class="tgl${unresOn?" on":""}" title="${resKnown?"":"线程解决状态未知，暂不可用"}"><input type="checkbox" id="rUnres"${unresOn?" checked":""}${resKnown?"":" disabled"}/>未解决</label>
    <label class="tgl${f.needsReply?" on":""}"><input type="checkbox" id="rReply"${f.needsReply?" checked":""}/>需我回复</label>
    <input type="search" id="rQ" aria-label="搜索检视意见" placeholder="搜索内容 / 作者 / 文件" value="${esc(f.q)}" />
    <div style="flex:1"></div><span class="count-pill">${data?countLabel(data.comments,data.total):"—"}</span>
  </div>${data&&state.rvError?staleNotice(state.rvError):""}${partialErrors(data?.errors)}${coverageNote(data?.coverage??ov.coverage)}${groups}</div>`; }

function cmtRow(c){ return `<div class="cmt">${avatar(c.author)}<div class="body">
  <div class="meta"><b>${esc(c.author?.name||c.author?.login)}</b>
    <span title="${esc(absTime(c.createdAt))}">${relTime(c.createdAt)}</span>
    ${c.file?`<span class="filechip" title="${esc(c.file)}${c.line?":"+esc(c.line):""}">${esc(c.file)}${c.line?":"+esc(c.line):""}</span>`:""}

function viewIssues(){const ov=state.overview;if(!ov)return overviewPlaceholder();const f=state.issueFilters,data=state.issueData;

    <select id="iState" aria-label="Issue 状态">${[["open","开放"],["closed","已关闭"],["all","全部状态"]].map(([v,l])=>`<option value="${v}"${f.state===v?" selected":""}>${l}</option>`).join("")}</select>
    <input type="search" id="iQ" aria-label="搜索 Issue" placeholder="搜索 Issue 标题 / 内容" value="${esc(f.q)}"/>
    <input type="text" id="iAssignee" aria-label="Issue 负责人" placeholder="负责人 GitHub 登录名" value="${esc(f.assignee)}"/>
    <span class="count-pill">${data?countLabel(data.issues,data.total):"—"}</span></div>${data&&state.issueError?staleNotice(state.issueError):""}${partialErrors(data?.errors)}${coverageNote(data?.coverage??ov.coverage)}
    <div class="card mrlist">${body}</div></div>`;}
function issueRow(i){const canDev=state.boot?.capabilities?.develop===true;
  return `<div class="mrrow" role="button" tabindex="0" data-issue="${esc(i.repoKey)}|${esc(i.number)}"><span class="no">#${esc(i.number)}</span><div class="body"><div class="t1">${stateChip(i)}<span class="title">${esc(i.title)}</span>${(i.labels||[]).map(l=>chip("label",l)).join("")}</div><div class="t2"><span class="repo-tag">${esc(i.repoPath||i.repoKey)}</span>${avatar(i.author)}<span>${esc(i.author?.name||i.author?.login)}</span><span>负责人：${esc((i.assignees||[]).join(", ")||"未分配")}</span><span>${relTime(i.updatedAt)}</span></div></div>${canDev?`<button class="btn sm" data-quickdev="${esc(i.repoKey)}|${esc(i.number)}" aria-label="快速开始开发 Issue #${esc(i.number)}">快速开始开发</button>`:""}</div>`;}
async function quickDevelop(pair){const [repoKey,number]=pair.split("|");const key=repoKey+"|"+number;
  if(!developmentWork.has(key))developmentWork.set(key,{sessionId:"",pending:false,error:""});
  const w=developmentWork.get(key);
  if(w.pending){toast("正在处理中…");return;}
  if(state.boot?.capabilities?.develop!==true||!host.available||!host.openSession){toast("DSH 原生开发能力不可用；请在 DSH 内打开 CodeHub 并检查宿主服务。",4500);return;}
  if(!w.sessionId&&!confirm("为 Issue #"+number+" 创建或复用 DSH 原生开发会话？需要该仓库已配置本地克隆路径。后续操作在 DSH 中进行。"))return;
  w.pending=true;w.error="";render();
  try{if(!w.sessionId){const j=await apiPost("issue.develop",{repoKey,number:Number(number),confirmed:true});w.sessionId=j.sessionId;}
    await hostRequest("open-session",w.sessionId);}
  catch(e){w.error=e.message;toast("开发会话启动失败："+e.message,5000);}
  finally{w.pending=false;render();}}

function viewRepos(){ const ov=state.overview; if(!ov) return overviewPlaceholder();

  return `<div class="wrap">${overviewFailureNote()}<div class="grid repogrid">${ov.repos.map(repoCard).join("")}</div></div>`; }

    <div class="ft"><span class="branch" title="${esc(r.defaultBranch?`默认分支 ${r.defaultBranch}`:'未获取到默认分支')}">⑂ ${esc(r.defaultBranch||"未知")}</span>
      ${r.localPath?`<span class="trunc" style="max-width:150px" title="${esc(r.localPath)}">📁 ${esc(r.localPath.split(/[\\\\/]/).pop())}</span>`:""}
      <span title="${esc(absTime(r.lastActivity))}">最近活动 ${relTime(r.lastActivity)}</span>
      <div style="flex:1"></div>
      <a class="btn sm" href="#/mrs&repoKey=${encodeURIComponent(r.key)}">查看 MR</a></div>

function beginDetail(kind,repoKey,number){

async function openMr(repoKey,number){const d=beginDetail("mr",repoKey,number);
  let diff; try{ diff=await api("mr.diff",{repoKey,number}); }catch(e){ diff={error:e.message}; }
  if(!currentDetail(d))return;
  try{
    if(!diff.error&&diff.mr){ d.mr=diff.mr;d.repo=diff.repo||diff.mr.repo;d.source=diff.source||diff.mr.source;d.detailErrors=diff.detailErrors;d.diff=diff;renderMrDetail(d);return; }
    const j=await api("mr",{repoKey,number});
    if(!currentDetail(d))return;
    d.mr=j.mr;d.repo=j.repo||j.mr.repo;d.source=j.source||j.mr.source;d.detailErrors=j.detailErrors;d.diff=diff;renderMrDetail(d);
  }catch(e){if(currentDetail(d))$("#drawerBody").innerHTML=`<div class="empty">加载失败：${esc(e.message)}。关闭后重新打开以重试。</div>`;}
}

// The draft used to live only in an in-memory Map, so reopening the MR lost every

function ensureReviewState(d){const w=workFor(d);
  if(w.restore)return w.restore;
  if(w.draft){w.restore=Promise.resolve();return w.restore;}
  w.restore=(async()=>{try{const j=await api("review.latest",{repoKey:d.repoKey,number:d.number});if(!currentDetail(d))return;
    if(j?.draft){w.draft=j.draft;w.body=j.draft.body||"";syncSelection(w);if(j.draft.status==="generating")scheduleReviewPoll(d);}}catch{}
    finally{if(currentDetail(d))renderReviewWorkspace(d);}})();
  return w.restore;}
function scheduleReviewPoll(d){setTimeout(async()=>{const w=workFor(d);
  if(!currentDetail(d)||!w.draft||w.draft.status!=="generating")return;
  try{const j=await api("review.latest",{repoKey:d.repoKey,number:d.number});if(!currentDetail(d))return;
    if(j?.draft){w.draft=j.draft;w.body=j.draft.body||"";syncSelection(w);}}catch{}
  finally{if(currentDetail(d)){renderReviewWorkspace(d);if(workFor(d).draft?.status==="generating")scheduleReviewPoll(d);}}},5000);}

  if(!ids.length||ids.length>10){toast(ids.length>10?"单次最多创建 10 个 Issue":"请先勾选要跟踪的问题");return;}
  if(!confirm(`将为选中的 ${ids.length} 个问题在该仓库创建 GitHub Issue（远程写入操作）。每个 Issue 会自动带上 MR 溯源与 AI 证据，且不自动指派。是否继续？`))return;
  w.filing=true;w.error="";w.fileError="";w.fileResults=null;renderReviewWorkspace(d);

document.addEventListener("input",(e)=>{ const t=e.target;if(updateConfigField(t))return;
  if(t.id==="reviewBody"&&detail?.kind==="mr"){const w=workFor(detail);if(w.pending||w.draft?.status==="published")return;w.body=t.value;w.preview=null;$("#reviewPreview").innerHTML="";return;}
  if(t.id==="fQ"){state.mrFilters.q=t.value;debounce(()=>{if(state.view==="mrs")nav("mrs",flatMrFilters());},350);}
  if(t.id==="rQ"){state.rvFilters.q=t.value;debounce(()=>{if(state.view==="reviews")nav("reviews",flatRvFilters());},350);}
  if(t.id==="iQ"){state.issueFilters.q=t.value;debounce(()=>{if(state.view==="issues")nav("issues",state.issueFilters);},350);}
});
document.addEventListener("focusin",(e)=>{const t=e.target;if(t?.matches?.('input[data-k="token"]'))try{t.select();}catch{}});
const flatMrFilters=()=>{const f=state.mrFilters;return {repoKey:f.repoKey,state:f.state==="all"?"":f.state,q:f.q,needsReview:f.needsReview?"1":"",unresolved:f.unresolved?"1":"",ci:f.ci};};
const flatRvFilters=()=>{const f=state.rvFilters;return {repoKey:f.repoKey,unresolved:f.unresolved?"1":"",needsReply:f.needsReply?"1":"",q:f.q};};
let _dbt=null; const debounce=(fn,ms)=>{clearTimeout(_dbt);_dbt=setTimeout(fn,ms);};

async function saveConfig(){const c=draft();if(!c||state.saving)return;const snapshot=JSON.stringify(c);state.saving=true;render();
  try{const j=await apiPost("config.set",JSON.parse(snapshot));state.boot.config=j.config;
    // Do not discard edits typed while the save request was in flight.
    const edited=JSON.stringify(state.configDraft)!==snapshot;
    if(!edited)state.configDraft=JSON.parse(JSON.stringify(j.config));
    // config.set returns overview:null; keep the last successful overview until
    // the queued background refresh supplies fresh data.
    if(j.overview){++overviewSeq;state.overview=j.overview;state.overviewError="";state.overviewLoaded=true;invalidateLists();}
    state.testResults=null;
    toast("配置已保存，后台刷新已排队"+(edited?"；后续编辑尚未保存":""),4500);
  }catch(e){toast("保存失败："+e.message,4000);}finally{state.saving=false;render();}}

boot();
</script>
</body>
</html>
